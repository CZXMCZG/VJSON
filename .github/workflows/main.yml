name: Elite Node Hunter

on:
  schedule:
    - cron: '0 */4 * * *' 
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools
        run: |
          pip install --upgrade pip
          pip install requests pyyaml

      - name: Run Hunter
        # ⚠️ 注意：这里去掉了 > /dev/null，为了能看到报错
        run: python elite_hunter.py

      - name: Deliver
        run: |
          git config --local user.email "hunter@github.com"
          git config --local user.name "EliteHunter"
          git add assets_manifest.bin
          git commit -m "update elite assets [skip ci]" || exit 0
          git push